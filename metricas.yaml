# Métricas municipais do Censo 2022 (nível N6), extraídas da API de agregados do IBGE:
#   https://servicodados.ibge.gov.br/api/v3/agregados/{tabela}/periodos/{periodo}/variaveis/{variavel}
#     ?localidades=N6[all]&classificacao={classificacao}[{categorias}]|{filtro}
#
# Campos de cada métrica
#   descricao          o que a métrica mede
#   dominio            chave em `dominios`; cada domínio é modelado separadamente
#   tabela, variavel   códigos do SIDRA
#   tipo               normalização: P = percentual/taxa (0-100) | L = cauda longa (log) | Z = anos, razão, média
#   filtro             {classificação: categoria} fixadas; classificações omitidas valem "Total"
#                      (exceção: algumas tabelas, como a 10127, exigem o Total explícito)
#   classificacao      classificação usada na razão
#   numerador          categorias somadas no numerador
#   denominador        categorias somadas no denominador (normalmente o Total da classificação)
# Sem numerador/denominador a métrica é "direta": o valor publicado da variável.
# Métricas de razão saem em % (numerador / denominador * 100).

periodo: 2022

dominios:
  D1:
    nome: Estrutura etária e população
    descricao: Idade, sexo, crescimento, densidade e urbanização da população.
  D2:
    nome: Composição étnico-racial
    descricao: Composição por cor ou raça e presença de povos tradicionais.
  D3:
    nome: Saúde e saneamento
    descricao: Indicadores diretos de saúde e seus determinantes sanitários (o Censo não mede morbidade).
  D4:
    nome: Moradia
    descricao: Tipo, posse e adensamento do domicílio e acesso a bens e serviços.
  D5:
    nome: Educação
    descricao: Alfabetização, escolaridade adulta e frequência escolar.
  D6:
    nome: Trabalho e renda
    descricao: Inserção no mercado de trabalho, informalidade, estrutura produtiva e renda.
  D7:
    nome: Mobilidade
    descricao: Deslocamento casa-trabalho, com pendularidade, tempo e meio de transporte.

metricas:

  # ---------------------------------------------------------------- D1
  - codigo: D1_1
    nome: Idade mediana
    descricao: Idade que divide a população ao meio; síntese do envelhecimento.
    dominio: D1
    tipo: Z
    tabela: 9515
    variavel: 10613

  - codigo: D1_3
    nome: Razão de sexo
    descricao: Homens por 100 mulheres; capta migração seletiva e sobremortalidade masculina.
    dominio: D1
    tipo: Z
    tabela: 9515
    variavel: 8845

  - codigo: D1_4
    nome: Taxa de crescimento geométrico 2010-2022
    descricao: Crescimento médio anual da população entre os Censos 2010 e 2022 (% a.a.).
    dominio: D1
    tipo: Z
    tabela: 4709
    variavel: 10605

  - codigo: D1_5
    nome: Densidade demográfica
    descricao: Habitantes por km²; intensidade de ocupação do território.
    dominio: D1
    tipo: L
    tabela: 4714
    variavel: 614

  - codigo: D1_6
    nome: "% população urbana"
    descricao: Parcela da população residente em situação urbana.
    dominio: D1
    tipo: P
    tabela: 9923
    variavel: 93                # População residente
    classificacao: 1            # Situação do domicílio
    numerador: [1]              # Urbana
    denominador: [6795]         # Total

  - codigo: D1_7
    nome: Média de moradores por domicílio
    descricao: Moradores por domicílio particular permanente ocupado.
    dominio: D1
    tipo: Z
    tabela: 4712
    variavel: 5930

